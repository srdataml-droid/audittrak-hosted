<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The problem AuditTrak solves</title>
  <desc id="desc">Job evidence starts in separate places. AuditTrak brings agreement, invoice, payment, and delivery records into one job, compares them, and shows a person what needs review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faf8"/><stop offset="1" stop-color="#edf4f0"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#173c31" flood-opacity=".09"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6d9281"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#19352e}
      .muted{fill:#657870}.small{font-size:16px}.label{font-size:17px;font-weight:700;letter-spacing:.05em}.card{fill:#fff;stroke:#dbe7e0;stroke-width:2}.line{fill:none;stroke:#82a391;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="78" font-size="15" font-weight="750" letter-spacing="2.4" fill="#28715b">AUDITTRAK · THE PROBLEM AND THE SOLUTION</text>
  <text x="64" y="130" font-size="34" font-weight="750">A single job leaves records in different places.</text>
  <text x="64" y="165" font-size="18" class="muted">When details differ or context is missing, someone has to piece the story together.</text>

  <text x="64" y="224" class="label" fill="#657870">JOB EVIDENCE</text>
  <g filter="url(#shadow)">
    <rect class="card" x="64" y="246" width="235" height="92" rx="16"/>
    <rect class="card" x="64" y="358" width="235" height="92" rx="16"/>
    <rect class="card" x="64" y="470" width="235" height="92" rx="16"/>
    <rect class="card" x="64" y="582" width="235" height="74" rx="16"/>
  </g>
  <g fill="none" stroke="#28715b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M91 275h22l10 10v27H91z M113 275v11h10 M98 296h17 M98 303h17"/>
    <path d="M91 387h22l10 10v27H91z M113 387v11h10 M98 408h17 M98 415h17"/>
    <path d="M91 498h28v32H91z M97 507h16 M97 514h16 M97 521h10"/>
    <path d="M91 604h27v26H91z M96 612h17 M96 619h10 M85 612l4 4 7-8"/>
  </g>
  <text x="140" y="283" font-size="18" font-weight="700">Agreement</text><text x="140" y="310" class="small muted">Message or document</text>
  <text x="140" y="395" font-size="18" font-weight="700">Invoice</text><text x="140" y="422" class="small muted">Billing tool or file</text>
  <text x="140" y="507" font-size="18" font-weight="700">Payment</text><text x="140" y="534" class="small muted">Bank or payment app</text>
  <text x="140" y="615" font-size="18" font-weight="700">Delivery proof</text><text x="140" y="640" class="small muted">Files or client reply</text>

  <path class="line" d="M322 452h86"/>
  <g filter="url(#shadow)">
    <rect x="428" y="310" width="316" height="286" rx="22" fill="#123b32"/>
  </g>
  <rect x="458" y="341" width="54" height="54" rx="16" fill="#286f5a"/>
  <path d="M472 358h26v21h-26z M478 352v7 M492 352v7 M472 365h26" fill="none" stroke="#eff8f3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="529" y="365" font-size="16" font-weight="700" letter-spacing="1.2" fill="#b7d9c9">AUDITTRAK</text>
  <text x="458" y="438" font-size="25" font-weight="750" fill="#fff">One job record</text>
  <text x="458" y="474" font-size="17" fill="#d3e4dc">Agreement · invoice · payment</text>
  <text x="458" y="502" font-size="17" fill="#d3e4dc">Delivery · client confirmation</text>
  <line x1="458" y1="526" x2="714" y2="526" stroke="#3d695d" stroke-width="1.5"/>
  <text x="458" y="558" font-size="15" fill="#b7d9c9">Records stay linked to their source.</text>

  <path class="line" d="M768 452h71"/>
  <g filter="url(#shadow)">
    <rect class="card" x="859" y="330" width="280" height="244" rx="22"/>
  </g>
  <text x="888" y="373" class="label" fill="#28715b">REVIEW SUMMARY</text>
  <circle cx="897" cy="418" r="8" fill="#3b8b68"/><text x="918" y="424" font-size="17" font-weight="650">What matches</text>
  <circle cx="897" cy="462" r="8" fill="#d89931"/><text x="918" y="468" font-size="17" font-weight="650">What differs</text>
  <circle cx="897" cy="506" r="8" fill="#8b9e98"/><text x="918" y="512" font-size="17" font-weight="650">What is missing</text>
  <rect x="888" y="535" width="219" height="1" fill="#e3ebe6"/>
  <text x="888" y="559" font-size="14" class="muted">A person reviews the evidence.</text>

  <text x="64" y="690" font-size="14" class="muted">AuditTrak organizes and compares supplied records; it does not certify authenticity or make credit or fraud decisions.</text>
</svg>
